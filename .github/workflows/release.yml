name: release
on:
  push:
    tags: ['v[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag
        run: |
          tag="${GITHUB_REF_NAME}"
          date="${tag#v}"; date="${date:0:10}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }
          python3 -c "import datetime,sys; datetime.date.fromisoformat(sys.argv[1])" "$date"
          prev=$(git tag --list 'v[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]*' --sort=-v:refname | grep -vx "$tag" | head -n1 || true)
          if [ -n "$prev" ] && [[ "$date" < "${prev:1:10}" ]]; then echo "tag date is earlier than $prev"; exit 1; fi
          echo "REVISION=$date" >> "$GITHUB_ENV"
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/catalog.py build dist "$REVISION"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "Catalog set revision $REVISION."
